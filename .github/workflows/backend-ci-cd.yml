name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ci-placeholder
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: "ci-only-jwt-secret-key-with-at-least-32-characters"
      OPENAI_VLM_FALLBACK_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BACKEND_IMAGE: gdam-backend:ci
      OPENAI_API_KEY: ci-placeholder
      POSTGRES_PASSWORD: ci-only-postgres-password
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: gdam-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start backend and PostgreSQL containers
        run: |
          mkdir -p ml_models/yolo
          docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Verify container runtime
        run: |
          test "$(docker compose exec -T backend id -u)" = "10001"
          docker compose exec -T db pg_isready -U gdam_user -d gdam_db

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            http://127.0.0.1:8000/health/live

          ready_status="$(curl --silent --output /tmp/gdam-readiness.json \
            --write-out '%{http_code}' http://127.0.0.1:8000/health/ready)"
          test "$ready_status" = "503"
          python -c "import json; checks=json.load(open('/tmp/gdam-readiness.json'))['detail']['checks']; assert checks == {'database': True, 'models': False, 'storage': True}, checks"

      - name: Verify container restart
        run: |
          docker compose restart backend
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            http://127.0.0.1:8000/health/live

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop smoke-test containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-test-server:
    name: Deploy test server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: gdam-test
    env:
      DEPLOY_HOST: gdam-test.duckdns.org
      DEPLOY_USER: ubuntu
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy validated commit to EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$GITHUB_SHA'" < scripts/deploy_test_server.sh

      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors \
            https://gdam-test.duckdns.org/health/ready >/dev/null
