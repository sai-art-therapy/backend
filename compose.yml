name: gdam

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdam_db
      POSTGRES_USER: gdam_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdam_user -d gdam_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    image: ${BACKEND_IMAGE:-gdam-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.docker}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_VLM_FALLBACK_ENABLED: ${OPENAI_VLM_FALLBACK_ENABLED:-false}
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-gpt-5.6-luna}
      OPENAI_VLM_VERIFY_CONF_MAX: ${OPENAI_VLM_VERIFY_CONF_MAX:-0.60}
      DATABASE_URL: postgresql+psycopg://gdam_user:${POSTGRES_PASSWORD}@db:5432/gdam_db
      SQLALCHEMY_ECHO: "false"
      CHROMA_PATH: /app/app/db/chroma
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.docker}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      YOLO_HTP_HOUSE_WEIGHTS_PATH: /app/ml_models/yolo/house_best.pt
      YOLO_HTP_TREE_WEIGHTS_PATH: /app/ml_models/yolo/tree_best.pt
      YOLO_HTP_PERSON_WEIGHTS_PATH: /app/ml_models/yolo/person_best.pt
      YOLO_HTP_FALLBACK_ENABLED: ${YOLO_HTP_FALLBACK_ENABLED:-true}
      RAG_ADMIN_ENABLED: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      RUN_DB_CREATE_ALL: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml_models:/app/ml_models:ro
      - uploads_data:/app/uploads
      - chroma_data:/app/app/db/chroma
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
